<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="flowmate-detail-title flowmate-detail-desc">
  <title id="flowmate-detail-title">FlowMate AI authoring workspace</title>
  <desc id="flowmate-detail-desc">AI 대화, Form Builder, Flow Builder를 하나의 화면에 구성한 제품 개념도</desc>
  <defs>
