  <defs>
    <linearGradient id="flowmate-bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#25205F"/>
    </linearGradient>
