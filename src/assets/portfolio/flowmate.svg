    <rect x="144" y="250" width="144" height="44" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="144" y="316" width="88" height="18" rx="9" fill="url(#flowmate-accent)"/>
